<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Sithum Wickramanayaka — Software Developer</title>
  <desc id="desc">A dark developer profile banner with a blue and violet glow.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b14"/>
      <stop offset="0.55" stop-color="#0b1224"/>
      <stop offset="1" stop-color="#11162b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1200" height="380" rx="28" fill="url(#background)"/>
  <circle cx="190" cy="80" r="190" fill="url(#glow)" filter="url(#blur)"/>
  <circle cx="1040" cy="330" r="220" fill="#8b5cf6" opacity="0.1" filter="url(#blur)"/>

  <g fill="none" stroke="#94a3b8" stroke-opacity="0.13">
    <path d="M0 80H1200M0 160H1200M0 240H1200M0 320H1200"/>
    <path d="M120 0V380M240 0V380M360 0V380M480 0V380M600 0V380M720 0V380M840 0V380M960 0V380M1080 0V380"/>
  </g>

  <g transform="translate(94 86)">
    <rect x="0" y="0" width="7" height="208" rx="3.5" fill="url(#accent)"/>
    <text x="42" y="83" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="58" font-weight="700" letter-spacing="-1.5">Sithum Wickramanayaka</text>
    <text x="46" y="137" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" letter-spacing="5">SOFTWARE DEVELOPER</text>
    <text x="46" y="188" fill="url(#accent)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18">&lt; ideas into useful software /&gt;</text>
  </g>

  <g transform="translate(1015 69)" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <path d="M-42 42-78 78l36 36M42 42l36 36-36 36M14 20-15 136"/>
  </g>
</svg>
